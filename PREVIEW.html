*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#142f49 0,transparent 42%),var(--bg);color:var(--text);font:13px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:258px;background:rgba(8,14,25,.96);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;z-index:10;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:12px;padding:8px 9px 25px;border-bottom:1px solid #ffffff10}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--cyan);background:linear-gradient(145deg,#173f54,#11253a);box-shadow:0 0 30px #49cce51c;font-size:23px}.brand b{font:700 17px 'Space Grotesk';letter-spacing:1.2px}.brand small{display:block;color:#71839c;font-size:9px;letter-spacing:2px;margin-top:4px}.section{font-size:9px;color:#63758d;letter-spacing:2px;padding:25px 10px 9px}.nav{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid transparent;border-radius:9px;background:none;color:#9aabc0;text-align:left;margin:2px 0;font-size:12px}.nav:hover{background:#ffffff08;color:white}.nav.active{background:linear-gradient(100deg,#123448,#102539);border-color:#2a728433;color:#a8f5ff}.nav em{margin-left:auto;font-style:normal;font-size:10px;color:#9cb5ca;background:#ffffff10;padding:3px 7px;border-radius:20px}.sidefoot{margin-top:auto}.research{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(145deg,#101e2d,#0b1320);font-size:10px;line-height:1.7;color:#92a3b8}.research b{color:#e8f3ff}.green-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}.main{margin-left:258px;min-height:100vh}.top{height:72px;position:sticky;top:0;z-index:8;background:#080e19df;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{font-size:10px;color:#71849d;letter-spacing:1.4px}.crumb span{color:var(--cyan)}.topright{display:flex;align-items:center;gap:12px}.live{border:1px solid #e9c88730;color:#e9c887;background:#e9c8870c;border-radius:30px;padding:7px 11px;font-size:9px;letter-spacing:.7px}.refresh,.hamb{border:1px solid var(--line);background:#ffffff05;color:#a9bad0;padding:9px 11px;border-radius:8px}.hamb{display:none}.content{max-width:1500px;padding:30px 38px 60px;margin:auto}.head{margin-bottom:23px}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--cyan);font-weight:700;margin-bottom:10px}.head h1{font:600 30px 'Space Grotesk';margin:0 0 8px;letter-spacing:-.7px}.head p{font-size:12px;color:#91a1b6;line-height:1.7;max-width:720px;margin:0}.hero{position:relative;min-height:330px;overflow:hidden;border:1px solid #39718a66;border-radius:18px;padding:38px;background:linear-gradient(90deg,rgba(5,13,25,.98) 0%,rgba(6,17,31,.88) 48%,rgba(5,15,28,.15) 100%),url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1800&q=85') center 42%/cover;box-shadow:0 25px 80px #0005}.hero:after{content:"";position:absolute;right:9%;top:50%;transform:translateY(-50%);width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#b8f7ff 0,#4186e8 22%,#1d3e8a 53%,#101a45 75%);box-shadow:0 0 80px #3ba7df55, inset -20px -20px 35px #050b27;opacity:.95}.orbit{position:absolute;right:5.4%;top:50%;transform:translateY(-50%) rotate(-18deg);width:300px;height:110px;border:1px solid #b8f5ff55;border-radius:50%;z-index:1}.orbit:after{content:"";position:absolute;inset:-48px -10px;border:1px solid #b8f5ff25;border-radius:50%}.hero-content{position:relative;z-index:2;max-width:670px}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #74dff344;background:#0b253b99;color:#b4f6ff;border-radius:30px;padding:8px 12px;font-size:9px;letter-spacing:1.5px}.hero h1{font:600 43px/1.12 'Space Grotesk';margin:23px 0 12px}.hero h1 span{color:var(--cyan)}.hero p{max-width:600px;color:#c0ccda;font-size:12px;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:8px;padding:12px 16px;background:var(--cyan);color:#07121c;font-weight:700;font-size:11px}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#ffffff0b;border:1px solid #ffffff28;color:#e8f2ff}.btn.ghost{background:transparent;border:1px solid var(--line);color:#b5c4d8}.btn.sm{padding:8px 11px;font-size:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:17px 0}.stat,.panel,.planet-card{border:1px solid var(--line);background:linear-gradient(145deg,#101a2a,#0c1421);border-radius:13px}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;color:#91a3ba;font-size:10px}.stat strong{display:block;font:600 26px 'Space Grotesk';margin:12px 0 4px}.stat small{color:#687d96;font-size:9px}.two{display:grid;grid-template-columns:1.45fr 1fr;gap:15px}.panel{padding:19px}.panel h3{font:600 14px 'Space Grotesk';margin:0 0 5px}.sub{font-size:10px;color:#8092aa;line-height:1.65}.planet-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #ffffff0c}.planet-thumb{width:42px;height:42px;border-radius:12px;flex:none;position:relative;overflow:hidden;background:radial-gradient(circle at 32% 27%,#b9f4ff,#4e9ad8 35%,#182d61 73%);box-shadow:0 0 20px #58c8e51b}.planet-thumb.pink{background:radial-gradient(circle at 30% 30%,#ffe1c7,#c9789e 42%,#41264e 78%)}.planet-thumb.gold{background:radial-gradient(circle at 30% 30%,#fff0bc,#c18c49 42%,#49332c 78%)}.planet-thumb.green{background:radial-gradient(circle at 30% 30%,#e1ffe2,#58a98d 40%,#183e4b 78%)}.grow{flex:1;min-width:0}.pname{font-size:11px;font-weight:700}.pmeta{font-size:9px;color:#778aa2;margin-top:4px}.tag{font-size:9px;border-radius:20px;padding:5px 8px;background:#ffffff0b;color:#aebed1}.iconbtn{border:0;background:none;color:#7d90a9;font-size:15px;padding:5px}.iconbtn.on{color:#f3a8c8}.search{display:flex;gap:9px;margin:15px 0}.field,.select{width:100%;background:#080f1b;border:1px solid #26364d;border-radius:8px;padding:11px 12px;color:#e8f1fc;font-size:11px;outline:none}.field:focus,.select:focus{border-color:#69e6f477}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0}.toolbar .field{flex:1;min-width:200px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#0d1523}table{border-collapse:collapse;width:100%;min-width:650px;text-align:left;font-size:11px}th{font-size:9px;letter-spacing:1px;color:#7487a0;background:#ffffff04}td,th{padding:14px 15px;border-bottom:1px solid #ffffff0d}tr:last-child td{border:0}tbody tr:hover{background:#ffffff04}.link{border:0;background:none;color:#e9f4ff;font-weight:700;padding:0;text-align:left}.link:hover{color:var(--cyan)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{display:block;font-size:10px;color:#a9b9cd;margin-bottom:7px}.help{font-size:9px;color:#73869e;line-height:1.6;margin-top:6px}.result{border:1px solid #69e6f42e;background:#69e6f40b;border-radius:11px;padding:16px;margin:16px 0}.result-title{font:600 20px 'Space Grotesk';margin:8px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.metric{padding:11px;border-radius:8px;background:#0002}.metric small{display:block;color:#8194ad;font-size:9px}.metric b{display:block;margin-top:5px;font-size:13px}.rule{border:1px solid #ffffff13;border-radius:9px;padding:12px;margin:8px 0}.rule small{color:var(--cyan);font-size:9px}.rule p{font-size:10px;color:#9aaec4;line-height:1.6;margin:6px 0 0}.empty{border:1px dashed #35475f;border-radius:12px;padding:40px;text-align:center;color:#8799b0}.empty b{display:block;color:#e5effb;margin:9px}.notice{padding:11px 13px;border:1px solid #69e6f433;background:#69e6f40c;border-radius:9px;color:#c1f7ff;font-size:10px;margin-bottom:15px;display:flex;justify-content:space-between}.modalbg{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:20px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;border:1px solid #344861;border-radius:16px;padding:22px;background:#101b2b}.close{float:right;background:none;border:0;color:#9bb0c9;font-size:20px}.banner-img{height:145px;border-radius:10px;background:linear-gradient(90deg,#08101b77,#08101b11),url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1200&q=80') center/cover;margin:14px 0}.foot{font-size:9px;color:#647992;line-height:1.7;margin-top:16px}.mobile-back{display:none}
@media(max-width:1000px){.side{width:230px}.main{margin-left:230px}.content{padding:25px}.two{grid-template-columns:1fr}.hero:after{right:4%;opacity:.5}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s;width:260px}.side.open{transform:translateX(0)}.main{margin:0}.hamb{display:block}.top{padding:0 15px}.content{padding:20px 14px}.hero{padding:25px}.hero h1{font-size:32px}.hero:after,.orbit{right:-90px;opacity:.25}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.formgrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.mobile-back.show{display:block;position:fixed;inset:0;background:#0009;z-index:9}}
</style></head><body><div class="shell"><aside class="side" id="side"><div class="brand"><div class="logo">◉</div><div><b>ASTRO<span style="color:var(--cyan)">EXPERT</span></b><small>EXOPLANET INTELLIGENCE</small></div></div><div class="section">WORKSPACE</div><nav id="nav"></nav><div class="sidefoot"><div class="research"><b>✦ Research mode</b><br>Transparent screening indicators. No claim of confirmed habitability or life.<p><span class="green-dot"></span>Interactive preview · sample data</p></div><p style="font-size:9px;color:#536780;margin:13px 5px">ASTROEXPERT · INTERACTIVE EDITION</p></div></aside><div class="mobile-back" id="backdrop" onclick="toggleMenu()"></div><main class="main"><header class="top"><div style="display:flex;align-items:center"><button class="hamb" onclick="toggleMenu()">☰</button><div class="crumb">ASTROEXPERT / <span id="crumb">OVERVIEW</span></div></div><div class="topright"><span class="live">● INTERACTIVE DEMO</span><button class="refresh" onclick="resetDemo()">↻</button></div></header><div class="content"><div id="notice" class="notice" hidden><span></span><button onclick="hideNotice()" style="background:none;border:0;color:inherit">✕</button></div><div id="app"></div></div></main></div><div id="modal"></div>
<script>
const pages=['Overview','Exoplanet Explorer','Habitability Assessment','Compare Worlds','Saved Worlds','Assessment History','Methodology'];
const icons=['▦','◎','✧','⇄','♡','◷','ⓘ'];
const seed=[
{id:1,name:'TRAPPIST-1 e',host:'TRAPPIST-1',method:'Transit',year:2017,radius:.92,mass:.69,period:6.10,axis:.02925,lum:.000553,temp:2566,flux:.646,source:'Archive snapshot sample',img:'pink'},
{id:2,name:'Proxima Centauri b',host:'Proxima Centauri',method:'Radial Velocity',year:2016,radius:null,mass:1.07,period:11.19,axis:.0485,lum:.0017,temp:3042,flux:.65,source:'Archive snapshot sample',img:'gold'},
{id:3,name:'Kepler-186 f',host:'Kepler-186',method:'Transit',year:2014,radius:1.17,mass:null,period:129.9,axis:.432,lum:.041,temp:3788,flux:.29,source:'Archive snapshot sample',img:'green'},
{id:4,name:'Kepler-452 b',host:'Kepler-452',method:'Transit',year:2015,radius:1.63,mass:null,period:384.8,axis:1.046,lum:1.2,temp:5757,flux:1.1,source:'Archive snapshot sample',img:'gold'},
{id:5,name:'TOI-700 d',host:'TOI-700',method:'Transit',year:2020,radius:1.14,mass:1.72,period:37.42,axis:.1633,lum:.023,temp:3480,flux:.85,source:'Archive snapshot sample',img:'green'},
{id:6,name:'51 Pegasi b',host:'51 Pegasi',method:'Radial Velocity',year:1995,radius:null,mass:150,period:4.23,axis:.052,lum:1.3,temp:5793,flux:null,source:'Archive snapshot sample',img:'pink'}];
let planets=JSON.parse(localStorage.getItem('astro_premium_planets')||'null')||seed.map(p=>({...p,fav:false}));
let history=JSON.parse(localStorage.getItem('astro_premium_history')||'[]'),compare=JSON.parse(localStorage.getItem('astro_premium_compare')||'[]');
let page='Overview',query='',filter='All',last=null;
const app=document.getElementById('app'),fmt=(v,d=2)=>v==null?'Unknown':Number(v).toLocaleString(undefined,{maximumFractionDigits:d});
function save(){localStorage.setItem('astro_premium_planets',JSON.stringify(planets));localStorage.setItem('astro_premium_history',JSON.stringify(history));localStorage.setItem('astro_premium_compare',JSON.stringify(compare));}
function notice(s){let n=document.getElementById('notice');n.hidden=false;n.querySelector('span').textContent=s}function hideNotice(){document.getElementById('notice').hidden=true}
function toggleMenu(){document.getElementById('side').classList.toggle('open');document.getElementById('backdrop').classList.toggle('show')}
function navRender(){document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button class="nav ${page===p?'active':''}" onclick="go('${p}')"><span>${icons[i]}</span>${p}${p==='Saved Worlds'?`<em>${planets.filter(x=>x.fav).length}</em>`:p==='Compare Worlds'?`<em>${compare.length}</em>`:''}</button>`).join('')}
function go(p){page=p;query='';document.getElementById('crumb').textContent=p.toUpperCase();document.getElementById('side').classList.remove('open');document.getElementById('backdrop').classList.remove('show');render()}
function head(k,t,d){return `<div class="head"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>`}
function metric(k,v){return `<div class="metric"><small>${k}</small><b>${v}</b></div>`}
function row(p){return `<div class="planet-row"><div class="planet-thumb ${p.img}"></div><div class="grow"><div class="pname">${p.name}</div><div class="pmeta">${p.host} · ${p.method}</div></div><span class="tag">${fmt(p.radius)} R⊕</span><button class="iconbtn ${p.fav?'on':''}" onclick="fav(${p.id})">♥</button><button class="iconbtn" onclick="cmp(${p.id})">⇄</button><button class="btn sm secondary" onclick="profile(${p.id})">Profile</button></div>`}
function overview(){return `<section class="hero"><div class="orbit"></div><div class="hero-content"><span class="pill">✧ EXOPLANET RESEARCH PLATFORM</span><h1>Find the worlds that<br><span>make us wonder.</span></h1><p>Explore distant planetary systems, inspect stellar and planetary measurements, and run transparent habitability screening with explainable rules.</p><div class="actions"><button class="btn" onclick="go('Exoplanet Explorer')">Explore exoplanets　›</button><button class="btn secondary" onclick="go('Habitability Assessment')">Run an assessment</button></div></div></section><div class="stats"><div class="stat"><div class="stat-top">Catalogue worlds <span>◎</span></div><strong>${planets.length}</strong><small>Curated sample catalogue</small></div><div class="stat"><div class="stat-top">Saved worlds <span>♡</span></div><strong>${planets.filter(p=>p.fav).length}</strong><small>Your research shortlist</small></div><div class="stat"><div class="stat-top">Assessments run <span>◷</span></div><strong>${history.length}</strong><small>Saved in this browser</small></div><div class="stat"><div class="stat-top">Data connection <span>◉</span></div><strong style="font-size:20px">Demo</strong><small>Bundled local catalogue</small></div></div><div class="two"><section class="panel"><h3>Featured exoplanets</h3><p class="sub">Explore remarkable worlds beyond our solar system</p>${planets.slice(0,4).map(row).join('')}<button class="btn ghost sm" style="margin-top:12px" onclick="go('Exoplanet Explorer')">Explore full catalogue　›</button></section><section class="panel"><h3>Explore the local exoplanet catalogue</h3><div class="banner-img"></div><p class="sub">Search the locally bundled catalogue. This standalone preview uses curated sample records so every interaction works offline.</p><div class="search"><input class="field" id="nq" placeholder="Search sample worlds e.g. TRAPPIST"><button class="btn" onclick="searchDemo()">Search</button></div><a class="sub" href="https://exoplanetarchive.ipac.caltech.edu/" target="_blank">Visit NASA Exoplanet Archive ↗</a></section></div>`}
function explorer(){let found=planets.filter(p=>(p.name.toLowerCase().includes(query.toLowerCase())||p.host.toLowerCase().includes(query.toLowerCase()))&&(filter==='All'||filter==='Favorites'&&p.fav||filter==='With radius'&&p.radius!=null));return `${head('CATALOGUE','Exoplanet Explorer','Search and inspect known worlds. Open a profile to explore its measured properties, discovery details and source record.')}<div class="toolbar"><input class="field" id="q" placeholder="Search planet or host star..." value="${query}"><select class="select" id="f" style="max-width:180px"><option>All</option><option ${filter==='Favorites'?'selected':''}>Favorites</option><option ${filter==='With radius'?'selected':''}>With radius</option></select><button class="btn ghost" onclick="query='';filter='All';render()">Reset</button></div><p class="sub">${found.length} worlds found · select up to three to compare</p><div class="tablewrap"><table><thead><tr><th>PLANET</th><th>HOST STAR</th><th>RADIUS</th><th>ORBIT</th><th>DISCOVERED</th><th>ACTIONS</th></tr></thead><tbody>${found.map(p=>`<tr><td><button class="link" onclick="profile(${p.id})">${p.name}</button><div class="pmeta">${p.method}</div></td><td>${p.host}</td><td>${fmt(p.radius)} R⊕</td><td>${fmt(p.axis,4)} AU</td><td>${p.year}</td><td><button class="iconbtn ${p.fav?'on':''}" onclick="fav(${p.id})">♥</button><button class="iconbtn" onclick="cmp(${p.id})">⇄</button></td></tr>`).join('')||'<tr><td colspan="6">No matching planets. Try a different search.</td></tr>'}</tbody></table></div>`}
function assessment(){return `${head('EXPERT SYSTEM','Habitability Assessment','Enter measured stellar and planetary properties to run a transparent, rule-based screening assessment. Unknown values are not treated as negative evidence.')}<div class="two"><section class="panel"><h3>Planet parameters</h3><p class="sub" style="margin:7px 0 17px">Enter values in the units shown. Mass and radius are optional.</p><form id="af"><label class="label">Planet name *</label><input class="field" name="name" required value="${last?.name||'Demo Exoplanet'}"><div class="formgrid" style="margin-top:14px"><div><label class="label">Stellar luminosity (L☉) *</label><input class="field" name="lum" type="number" min=".000001" step="any" required value="${last?.lum||'.5'}"></div><div><label class="label">Semi-major axis (AU) *</label><input class="field" name="axis" type="number" min=".000001" step="any" required value="${last?.axis||'.7'}"></div><div><label class="label">Planet radius (R⊕)</label><input class="field" name="radius" type="number" min=".000001" step="any" value="${last?.radius||'1.1'}"></div><div><label class="label">Planet mass (M⊕)</label><input class="field" name="mass" type="number" min=".000001" step="any" value="${last?.mass||'1.2'}"></div></div><p class="help">Only enter positive measurements. Leave unavailable measurements blank.</p><button class="btn" style="width:100%;margin-top:18px">Run expert assessment ✧</button></form></section><section class="panel"><h3>Assessment result</h3><div id="result">${last?resultHTML(last.result):'<div class="empty" style="margin-top:20px">✧<b>Your results will appear here</b>Submit the measured parameters to see screening indicators and rule explanations.</div>'}</div></section></div>`}
function resultHTML(r){return `<div class="result"><div class="eyebrow">SCREENING OUTCOME</div><div class="result-title">${r.label}</div><div class="metrics">${metric('Stellar flux',fmt(r.flux,4)+' S⊕')}${metric('Relative density',r.density==null?'Unknown':fmt(r.density,3)+' ρ⊕')}${metric('Simplified HZ inner',fmt(r.inner,4)+' AU')}${metric('Simplified HZ outer',fmt(r.outer,4)+' AU')}</div></div><h3>Rule explanations</h3>${r.rules.map(x=>`<div class="rule"><small>${x.id} · ${x.title}</small><p>${x.text}</p></div>`).join('')}<p class="foot">Simplified luminosity-scaled HZ approximation only. It does not model atmospheric composition, clouds, albedo, greenhouse effects or climate uncertainty. This result is not evidence of life.</p>`}
function runAssess(e){e.preventDefault();let d=new FormData(e.target),name=d.get('name'),lum=+d.get('lum'),axis=+d.get('axis'),radius=d.get('radius')===''?null:+d.get('radius'),mass=d.get('mass')===''?null:+d.get('mass');if(!(lum>0&&axis>0)||radius!==null&&!(radius>0)||mass!==null&&!(mass>0)){notice('Enter valid positive values.');return}let inner=.95*Math.sqrt(lum),outer=1.67*Math.sqrt(lum),flux=lum/(axis*axis),density=mass!==null&&radius!==null?mass/radius**3:null,rules=[],hz=axis>=inner&&axis<=outer,size=radius!==null&&radius>=.8&&radius<=1.4;if(hz)rules.push({id:'HZ-01',title:'Simplified habitable-zone screen',text:'Orbital distance falls within the project’s simplified luminosity-scaled habitable-zone interval.'});if(size)rules.push({id:'SIZE-01',title:'Earth-size radius screen',text:'Planet radius falls within the provisional 0.8–1.4 Earth-radii screening band. This does not prove rocky composition.'});if(density!==null)rules.push({id:'DENS-01',title:'Relative density calculated',text:'Mass and radius are available. Bulk density is an indicator, not definitive composition evidence.'});if(hz&&size)rules.push({id:'FINAL-01',title:'Multiple screening indicators',text:'Both preliminary HZ and Earth-size screens are met. This is a shortlist indicator, not a habitability verdict.'});let r={label:hz&&size?'Multiple screening indicators':rules.length?'Some indicators met':'Insufficient indicators',flux,density,inner,outer,rules};last={name,lum,axis,radius,mass,result:r};history.unshift({id:Date.now(),name,label:r.label,flux,date:new Date().toLocaleString()});save();document.getElementById('result').innerHTML=resultHTML(r);notice('Assessment completed and saved to this browser’s preview history.')}
function comparePage(){let chosen=planets.filter(p=>compare.includes(p.id));return `${head('SIDE-BY-SIDE ANALYSIS','Compare Worlds','Compare up to three exoplanets using reported catalogue properties. Unknown values remain clearly marked.')}<div class="toolbar">${planets.map(p=>`<button class="btn sm ${compare.includes(p.id)?'':'ghost'}" onclick="cmp(${p.id})">${compare.includes(p.id)?'✓ ':''}${p.name}</button>`).join('')}</div>${chosen.length?`<div class="tablewrap"><table><thead><tr><th>PROPERTY</th>${chosen.map(p=>`<th>${p.name}</th>`).join('')}</tr></thead><tbody>${[['Host star',p=>p.host],['Radius (R⊕)',p=>fmt(p.radius)],['Mass (M⊕)',p=>fmt(p.mass)],['Orbital period (days)',p=>fmt(p.period)],['Semi-major axis (AU)',p=>fmt(p.axis,4)],['Stellar temperature (K)',p=>fmt(p.temp,0)],['Insolation (S⊕)',p=>fmt(p.flux)],['Discovery method',p=>p.method]].map(([k,get])=>`<tr><td>${k}</td>${chosen.map(p=>`<td>${get(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">⇄<b>Select planets to compare</b>Choose up to three planets above.</div>'}`}
function savedPage(){let f=planets.filter(p=>p.fav);return `${head('YOUR COLLECTION','Saved Worlds','Your bookmarked exoplanets. Selections persist in this browser during the preview.')}<div class="two">${f.map(p=>`<div class="panel">${row(p)}<button class="btn ghost sm" onclick="profile(${p.id})">Open profile</button></div>`).join('')}</div>${f.length?'':'<div class="empty">♡<b>No saved worlds yet</b>Use the heart icon in Exoplanet Explorer to save planets.</div>'}`}
function historyPage(){return `${head('RESEARCH LOG','Assessment History','Review previous screening runs saved in this browser.')}<div class="panel">${history.length?history.map(h=>`<div class="planet-row"><div class="grow"><b>${h.name}</b><div class="pmeta">${h.date} · Flux ${fmt(h.flux,4)} S⊕</div></div><span class="tag">${h.label}</span></div>`).join(''):'<div class="empty">◷<b>No assessments yet</b>Run an assessment to create your first report.</div>'}</div>`}
function methodPage(){let data=[['Stellar flux','S = (L/L☉) ÷ (a/AU)²','Estimates incident stellar energy relative to Earth from stellar luminosity and orbital distance.'],['Preliminary habitable-zone interval','Inner = 0.95√L AU · Outer = 1.67√L AU','A simplified luminosity-scaled approximation. A robust model must account for stellar effective temperature and climate assumptions.'],['Relative bulk density','ρ / ρ⊕ = (M/M⊕) ÷ (R/R⊕)³','Calculated only when mass and radius are available. Density alone does not prove composition.'],['Forward chaining','IF known conditions THEN add conclusion','The rule engine evaluates conditions and records which rules fired.']];return `${head('TRANSPARENCY','Methodology & Limitations','Understand the calculations, rule logic, scientific assumptions and boundaries of this screening tool.')}<div class="two">${data.map(x=>`<section class="panel"><h3>${x[0]}</h3><div style="margin:15px 0;padding:14px;border-radius:9px;background:#07101d;color:var(--cyan);font:12px monospace">${x[1]}</div><p class="sub">${x[2]}</p></section>`).join('')}</div><section class="panel" style="margin-top:15px;border-color:#a47d3a55"><h3 style="color:var(--gold)">Scientific disclaimer</h3><p class="sub" style="margin-top:10px;line-height:1.9">A planet in the habitable zone is not necessarily habitable. Atmosphere, surface pressure, clouds, albedo, greenhouse effects, geology, stellar activity and other factors matter. A screening result cannot establish liquid water or life. Values may be revised and may carry measurement uncertainty.</p></section><section class="panel" style="margin-top:15px"><h3>Data provenance</h3><p class="sub" style="margin-top:8px">This preview uses a curated sample catalogue for interaction. The complete app uses a bundled local catalogue snapshot with source attribution and no live import.</p><a class="sub" href="https://exoplanetarchive.ipac.caltech.edu/" target="_blank">NASA Exoplanet Archive ↗</a></section>`}
function render(){navRender();app.innerHTML=page==='Overview'?overview():page==='Exoplanet Explorer'?explorer():page==='Habitability Assessment'?assessment():page==='Compare Worlds'?comparePage():page==='Saved Worlds'?savedPage():page==='Assessment History'?historyPage():methodPage();let q=document.getElementById('q');if(q)q.oninput=e=>{query=e.target.value;let pos=q.selectionStart;render();let el=document.getElementById('q');el.focus();el.setSelectionRange(pos,pos)};let f=document.getElementById('f');if(f)f.onchange=e=>{filter=e.target.value;render()};let af=document.getElementById('af');if(af)af.onsubmit=runAssess}
function fav(id){let p=planets.find(x=>x.id===id);p.fav=!p.fav;save();render()}
function cmp(id){if(compare.includes(id))compare=compare.filter(x=>x!==id);else if(compare.length<3)compare.push(id);else{notice('You can compare up to three planets.');return}save();render()}
function searchDemo(){query=document.getElementById('nq').value;go('Exoplanet Explorer');render()}
function profile(id){let p=planets.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="closeProfile()"><div class="modal" onclick="event.stopPropagation()"><button class="close" onclick="closeProfile()">×</button><div class="eyebrow">EXOPLANET PROFILE</div><h2 style="font:600 25px 'Space Grotesk'">${p.name}</h2><p class="sub">Host star · ${p.host}</p><div class="banner-img"></div><div class="metrics">${metric('Radius',fmt(p.radius)+' R⊕')}${metric('Mass',fmt(p.mass)+' M⊕')}${metric('Orbital period',fmt(p.period)+' days')}${metric('Semi-major axis',fmt(p.axis,4)+' AU')}${metric('Stellar temperature',fmt(p.temp,0)+' K')}${metric('Insolation',fmt(p.flux)+' S⊕')}</div><div class="actions"><button class="btn" onclick="prefill(${p.id})">Assess this planet</button><button class="btn secondary" onclick="fav(${p.id});closeProfile()">♡ Save world</button><a class="btn ghost" href="https://science.nasa.gov/exoplanet-catalog/" target="_blank">Archive source ↗</a></div><p class="foot">Catalogue values may have uncertainties and missing fields. Verify the source record before scientific use.</p></div></div>`}
function closeProfile(){document.getElementById('modal').innerHTML=''}
function prefill(id){let p=planets.find(x=>x.id===id);last={name:p.name,lum:p.lum||'',axis:p.axis||'',radius:p.radius||'',mass:p.mass||''};closeProfile();go('Habitability Assessment')}
function resetDemo(){if(confirm('Reset preview favourites, comparisons and assessment history?')){localStorage.removeItem('astro_premium_planets');localStorage.removeItem('astro_premium_history');localStorage.removeItem('astro_premium_compare');location.reload()}}
render();
</script></body></html>
